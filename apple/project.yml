name: Fork
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: '26.0'
    macOS: '26.0'
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.waffu.fork
    PRODUCT_NAME: Fork
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Fork
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: Fork connects to your reference library server.
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_NSSupportsAutomaticTermination: YES
    INFOPLIST_KEY_NSSupportsSuddenTermination: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: '-Onone'
      # Allow Swift's macro helper to run inside an already sandboxed build host.
      OTHER_SWIFT_FLAGS: '$(inherited) -disable-sandbox'
targets:
  Fork:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources: [Fork]
    info:
      path: Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: false
    settings:
      base:
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: '1,2'
      configs:
        Debug:
          'CODE_SIGN_IDENTITY[sdk=macosx*]': '-'
        Release:
          'CODE_SIGN_IDENTITY[sdk=macosx*]': '-'
schemes:
  Fork:
    build:
      targets:
        Fork: all
    run:
      config: Debug
